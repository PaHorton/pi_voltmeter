[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "voltmeter"
version = "0.1.0"
description = "Pluggable lab logger with Raspberry Pi ADS1115 voltmeter and OLED support"
requires-python = ">=3.9"
dependencies = ["Pillow", "PyYAML"]

[project.optional-dependencies]
pi = ["smbus2", "luma.oled", "gpiozero", "lgpio"]
tigerdata = ["psycopg[binary]"]
lakeshore = ["pyserial"]
web = ["fastapi", "psycopg[binary]", "uvicorn"]
dev = ["pytest", "httpx"]

[project.scripts]
voltmeter = "voltmeter.app:main"
lablogger = "voltmeter.lab_app:main"

[tool.setuptools]
packages = ["voltmeter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
