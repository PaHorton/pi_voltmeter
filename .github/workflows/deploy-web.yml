name: Deploy web dashboard

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "formulas/**"
      - "voltmeter/formulas.py"
      - "tests/test_web.py"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

concurrency:
  group: deploy-web
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e '.[dev,web]'
      - run: pytest -q

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Stage shared code into web/
        run: |
          mkdir -p web/voltmeter web/formulas
          cp voltmeter/__init__.py voltmeter/formulas.py web/voltmeter/
          cp formulas/*.txt web/formulas/
      - run: npm install -g vercel
      - name: Deploy
        working-directory: web
        run: |
          vercel pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"
          vercel build --prod --token="${{ secrets.VERCEL_TOKEN }}"
          vercel deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}"
