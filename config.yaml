# Device configuration. All keys are optional; values shown are the defaults.
# Copy to $VOLTMETER_HOME/config.yaml (default ~/voltmeter/config.yaml) to customise.
# User preferences changed from the on-screen menu live in settings.json instead.

device:
  adc:                     # ADS1115
    bus: 1                 # I2C bus number
    address: 0x48
  display:                 # SSD1306 128x64 OLED
    bus: 1
    address: 0x3C
  buttons:                 # BCM GPIO numbers (Adafruit OLED bonnet)
    up: 17
    down: 22
    left: 27
    right: 23
    select: 4              # joystick press
    a: 5
    b: 6
  usb:
    mount_roots: [/media/, /mnt/, /run/media/]
    device_prefix: /dev/sd
    formulas_dir: formulas       # folder on the stick to import formulas from
    log_dir: voltmeter_logs      # folder on the stick for CSV logs

# TigerData (Postgres + TimescaleDB) publishing. Get the host/port/user/dbname from your
# service's connection details; export the password as $VOLTMETER_DB_PASSWORD (not stored here).
database:
  enabled: false
  host: ""                       # e.g. abc123xyz.tsdb.cloud.timescale.com
  port: 5432
  dbname: tsdb
  user: tsdbadmin
  password_env: VOLTMETER_DB_PASSWORD
  sslmode: require
  table: readings
  device_id: ""                  # defaults to this Pi's hostname
  batch_size: 50                 # rows per INSERT
  flush_interval_s: 5.0          # max wait before sending a partial batch
  max_buffer: 100000             # rows kept in memory while offline (oldest dropped beyond)
