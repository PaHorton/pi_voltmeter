version: 1
systems:
  - id: demo-lab
    label: Demonstration lab
    sensors:
      - id: pressure
        label: Chamber pressure
        instrument_id: demo-gauge
        unit: Torr
        stale_after_s: 30
      - id: temperature
        label: Cold-head temperature
        instrument_id: demo-thermometer
        unit: "°C"
        stale_after_s: 30
